name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

  
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Harmless placeholders so bundling and future tests don't choke on empty values
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Ensure no sensitive .env files are committed
        run: |
          if git ls-files --error-unmatch .env* >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove them and rotate any keys inside."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test --if-present

      - name: Verify the app bundles
        run: npx expo export --platform android

      - name: Expo Doctor (informational only)
        run: npx expo-doctor
        continue-on-error: true      
        
      - name: Publish OTA update to the production channel
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: eas update --branch production --message "$COMMIT_MSG" --non-interactive

      
